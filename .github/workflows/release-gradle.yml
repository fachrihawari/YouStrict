name: Release APK (Gradle)

# Builds the signed APK on a GitHub runner with Gradle, without touching EAS.
#
# The EAS `release-*` profiles remain the fallback, but this workflow keeps the
# 15-builds-a-month EAS quota for when it is actually needed.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64   `base64 -w0 credentials/android/keystore.jks`
#   ANDROID_KEYSTORE_PASSWORD keystore password (from credentials.json)
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
#
# `bash scripts/export-signing-secrets.sh` prints the `gh secret set` commands.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: CPU architecture to build
        type: choice
        options: [arm64-v8a, armeabi-v7a]
        default: arm64-v8a

permissions:
  contents: read

concurrency:
  group: release-apk-gradle-${{ github.ref }}-${{ inputs.arch }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_ARCHS: ${{ inputs.arch }}
      EXPO_TV: '1'
      # Must stay above every versionCode ever shipped. EAS is at 22, so a
      # large offset keeps Gradle builds ahead of it and monotonic across runs.
      VERSION_CODE: ${{ github.run_number + 1000 }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: bun install --frozen-lockfile

      # app.config.js turns BUILD_ARCHS into buildArchs + R8 + resource shrinking.
      - name: Prebuild
        run: bunx expo prebuild --clean --platform android --no-install

      - name: Verify the generated project
        run: |
          grep -E '^reactNativeArchitectures=' android/gradle.properties
          grep -E '^android.enableMinifyInReleaseBuilds=' android/gradle.properties
          grep -E '^android.enableShrinkResourcesInReleaseBuilds=' android/gradle.properties
          test "$(grep -c "^reactNativeArchitectures=${BUILD_ARCHS}$" android/gradle.properties)" = 1
          grep -E "^    versionCode ${VERSION_CODE}$" android/app/build.gradle

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing. See the header of this workflow."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/signing/release.jks" \
            -storepass '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' >/dev/null
          echo "Keystore OK"

      - name: Point Gradle at the release keystore
        run: bun scripts/patch-android-signing.ts

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Inspect the APK
        run: |
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$apk" || { echo '::error::No APK produced.'; exit 1; }
          cp "$apk" "youstrict-${{ inputs.arch }}.apk"
          ls -lh "youstrict-${{ inputs.arch }}.apk"
          {
            echo "### ${{ inputs.arch }}"
            echo
            bun scripts/apk-report.ts "youstrict-${{ inputs.arch }}.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.arch }}
          path: youstrict-${{ inputs.arch }}.apk
          if-no-files-found: error
