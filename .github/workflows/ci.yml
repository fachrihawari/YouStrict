name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - catalog/channels.json

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun test
      - run: bunx expo-doctor

      # db/schema.ts and the committed migrations must agree.
      - name: Migrations are up to date
        run: |
          bunx drizzle-kit generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --short -- drizzle
            echo "::error::db/schema.ts changed without a migration. Run 'bunx drizzle-kit generate' and add it to drizzle/migrations.js."
            exit 1
          fi
